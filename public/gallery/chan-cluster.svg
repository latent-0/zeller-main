<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
<defs>
  <radialGradient id="bg" cx="50%" cy="35%" r="65%">
    <stop offset="0%" stop-color="#0e0a0c"/>
    <stop offset="100%" stop-color="#050304"/>
  </radialGradient>
  <linearGradient id="cry1" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0%" stop-color="#f5eec0"/>
    <stop offset="40%" stop-color="#d4a840"/>
    <stop offset="100%" stop-color="#7a5010" stop-opacity="0.6"/>
  </linearGradient>
  <linearGradient id="cry2" x1="0.6" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e8dca0"/>
    <stop offset="50%" stop-color="#b87830"/>
    <stop offset="100%" stop-color="#5a3808" stop-opacity="0.5"/>
  </linearGradient>
  <filter id="gf"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="1000" fill="url(#bg)"/>
<!-- Crystal shards radiating downward -->
<polygon points="400,280 389,460 411,460" fill="url(#cry1)" transform="rotate(-5 400 280)" filter="url(#gf)" opacity="0.92"/><polygon points="360,300 352,450 368,450" fill="url(#cry2)" transform="rotate(-18 360 300)" filter="url(#gf)" opacity="0.92"/><polygon points="440,295 431,455 449,455" fill="url(#cry1)" transform="rotate(15 440 295)" filter="url(#gf)" opacity="0.92"/><polygon points="330,320 323,440 337,440" fill="url(#cry2)" transform="rotate(-30 330 320)" filter="url(#gf)" opacity="0.92"/><polygon points="470,315 462.5,445 477.5,445" fill="url(#cry1)" transform="rotate(25 470 315)" filter="url(#gf)" opacity="0.92"/><polygon points="310,340 304,440 316,440" fill="url(#cry2)" transform="rotate(-40 310 340)" filter="url(#gf)" opacity="0.92"/><polygon points="490,335 483.5,445 496.5,445" fill="url(#cry1)" transform="rotate(35 490 335)" filter="url(#gf)" opacity="0.92"/><polygon points="380,310 375,440 385,440" fill="url(#cry2)" transform="rotate(8 380 310)" filter="url(#gf)" opacity="0.92"/><polygon points="420,305 414.5,445 425.5,445" fill="url(#cry1)" transform="rotate(-10 420 305)" filter="url(#gf)" opacity="0.92"/><polygon points="350,335 345.5,435 354.5,435" fill="url(#cry2)" transform="rotate(-22 350 335)" filter="url(#gf)" opacity="0.92"/><polygon points="450,330 445,435 455,435" fill="url(#cry1)" transform="rotate(20 450 330)" filter="url(#gf)" opacity="0.92"/><polygon points="395,320 391,400 399,400" fill="url(#cry2)" transform="rotate(3 395 320)" filter="url(#gf)" opacity="0.92"/>
<!-- Glow at center -->
<ellipse cx="400" cy="280" rx="40" ry="25" fill="#f0d860" opacity="0.25" filter="url(#gf)"/>
<!-- Ceiling stem -->
<rect x="394" y="120" width="12" height="160" fill="#b87820" rx="4"/>
<ellipse cx="400" cy="270" rx="30" ry="16" fill="#c89030" opacity="0.9"/>
</svg>